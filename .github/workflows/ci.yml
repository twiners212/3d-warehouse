name: Continuous Integration & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Linting & Static Checks
        run: npm run lint

      - name: Production Build Verification
        env:
          DATABASE_URL: "postgresql://ci_dummy:dummy@localhost:5432/dummy"
          WMS_API_KEY: "ci-secret-key"
        run: npm run build
